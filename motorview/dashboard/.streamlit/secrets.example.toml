# Copie para .streamlit/secrets.toml (local) ou cole o conteúdo em
# "Settings -> Secrets" do app no Streamlit Community Cloud.
# NUNCA versione o secrets.toml de verdade (já está no .gitignore).
# Tudo abaixo é PLACEHOLDER - nenhuma senha real deve entrar no Git.

# IMPORTANTE: username/password aqui devem ser da credencial "subscribe
# only" do broker (ex.: motorview-ingest) - NUNCA a credencial de
# publicação do gateway (motorview-gateway-planta1).
MOTORVIEW_MQTT_HOST = "xxxxxxxx.s1.eu.hivemq.cloud"
MOTORVIEW_MQTT_PORT = 8883
MOTORVIEW_MQTT_USE_TLS = "true"
MOTORVIEW_MQTT_USERNAME = "motorview-ingest"
MOTORVIEW_MQTT_PASSWORD = "TROQUE-ESTA-SENHA"
MOTORVIEW_MQTT_CLIENT_ID = "motorview-dashboard"
MOTORVIEW_MQTT_TOPIC_FILTER = "motorview/planta1/#"

# true = bloqueia o dashboard (fail-closed) se [auth] não estiver
# configurado, em vez de abrir sem login por engano. Ative isso no deploy
# de produção; deixe "false" (ou omita) para desenvolver localmente sem
# precisar configurar o Entra ainda.
MOTORVIEW_REQUIRE_AUTH = "false"

# true = mostra avisos internos de configuração (MQTT/auth não configurados,
# nomes de variável, caminhos de arquivo) no topo do app. Deixe "false" (ou
# omita) em produção - um visitante comum não deve ver pista nenhuma de
# infraestrutura interna. Ative só localmente enquanto desenvolve.
MOTORVIEW_DEBUG = "false"

# Allowlist própria do app - só esses e-mails conseguem passar do login,
# mesmo autenticando com sucesso no Microsoft Entra (2ª camada de
# autorização, além do "Assignment required" do Entra Enterprise App).
AUTHORIZED_EMAILS = "fulano@nacionalgas.com.br,ciclano@endtech.com.br"

# Login com Microsoft (OIDC nativo do Streamlit: st.login/st.logout/st.user).
# Descomente e preencha depois de criar o "App registration" no Azure/Entra.
# Enquanto esse bloco não existir, o dashboard roda em modo aberto (sem
# login) só para desenvolvimento, a menos que MOTORVIEW_REQUIRE_AUTH=true -
# ver auth.py.
#
# [auth]
# redirect_uri = "https://SEU_APP.streamlit.app/oauth2callback"
# cookie_secret = "SEGREDO_LONGO_ALEATORIO_TROQUE_ISSO"
#
# [auth.microsoft]
# client_id = "..."
# client_secret = "..."
# server_metadata_url = "https://login.microsoftonline.com/SEU_TENANT_ID/v2.0/.well-known/openid-configuration"
