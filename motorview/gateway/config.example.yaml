# Copie este arquivo para "config.yaml" (mesma pasta) e ajuste os valores.
# config.yaml é ignorado pelo git (contém host/senha do broker) - veja .gitignore.

serial:
  port: /dev/ttyUSB0       # Windows (teste local): "COM3" etc. No Raspberry Pi normalmente
                            # /dev/ttyUSB0 (conversor USB-RS485) ou /dev/ttyAMA0 (GPIO UART).
  baudrate: 19200           # CFW500: P0310=1 (padrão). Para o teste com AS320P-B use 9600.
  parity: "E"                # CFW500: P0311=1 (8E1 padrão). Para o teste com AS320P-B use "N".
  stopbits: 1
  bytesize: 8
  timeout: 0.3                 # resposta RTU normalmente é rápida; evita travar o ciclo em slave offline
  retries: 0                    # não repete requisição ausente; importante para monitoramento rápido

poll_interval_seconds: 2        # telemetria completa de todos os inversores
comm_error_heartbeat_seconds: 60 # erro de comunicação: publica na mudança e depois só heartbeat

# Monitoramento de alta frequência para motores críticos.
# A corrente bruta fica LOCAL no Raspberry a cada 100 ms.
# O HiveMQ recebe somente resumo de 500 ms com min/max/média/última.
fast_monitoring:
  enabled: true
  inverters:
    - inv01
  current_sample_interval_ms: 100
  current_publish_interval_ms: 500
  fault_poll_interval_ms: 250
  raw_flush_interval_ms: 1000
  raw_retention_days: 7

site_id: planta1                # identifica esta unidade/planta nos tópicos MQTT

inverters:
  - id: inv01
    name: "Motor 01 - Linha 01"
    slave_id: 1
    register_map: registers_weg_cfw500.yaml
  - id: inv02
    name: "Motor 02 - Linha 02"
    slave_id: 2
    register_map: registers_weg_cfw500.yaml
  # adicione um bloco "- id: ..." por inversor no barramento RS-485
  # (cada um com seu próprio slave_id, configurado em P0308 no CFW500)

mqtt:
  enabled: true                    # false = teste local sem broker MQTT
  host: xxxxxxxx.s1.eu.hivemq.cloud   # troque pelo host do seu cluster HiveMQ Cloud
  port: 8883                            # TLS (HiveMQ Cloud free tier exige TLS na 8883)
  use_tls: true
  username: motorview-gateway
  password: "TROQUE-ESTA-SENHA"          # prefira MOTORVIEW_MQTT_PASSWORD via .env (veja README)
  client_id: motorview-gateway-planta1   # único por dispositivo/gateway
  qos: 1
  keepalive_seconds: 30

local_log:
  db_path: data/motorview_gateway.db     # log local (SQLite) de tudo que é lido, mesmo sem internet
  retention_days: 90                     # linhas mais antigas que isso são limpas automaticamente

logging:
  level: INFO                             # DEBUG para depurar leituras Modbus/MQTT
  file: data/gateway.log
